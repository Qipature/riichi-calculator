<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🀄 日麻番符计算器</title><style>body{margin:0;background:#101b20;color:#f4f6f5;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:16px}h1{font-size:25px}h2{font-size:18px;margin:0 0 12px}section{background:#1c3037;border:1px solid #34505a;border-radius:16px;padding:17px;margin:13px 0}label{display:block;margin:10px 0 5px;color:#c8d6d8}select,input,button{box-sizing:border-box;border:1px solid #63808b;background:#12252d;color:white;border-radius:9px;padding:12px;font-size:16px;width:100%}input[type=checkbox]{width:auto;transform:scale(1.2);margin-right:9px}.checks label{display:flex;align-items:center;gap:6px;padding:5px 0;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{background:#174b42;border:1px solid #37a188;text-align:center}.big{font-size:34px;font-weight:800}.small{font-size:13px;color:#b5c7cc;line-height:1.7}.warning{color:#ffcf8c}.muted{color:#b5c7cc}button{background:#2d7868;border:0;font-weight:bold;margin-top:12px}hr{border:0;border-top:1px solid #43606a}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🀄 日麻番符计算器</h1><p class="muted">线下四人立直麻将 · 无需记分板 · 手机友好</p><section><h2>① 和牌方式</h2><div class="grid"><div><label>和牌者</label><select id="dealer"><option value="0">闲家</option><option value="1">庄家</option></select></div><div><label>方式</label><select id="win"><option value="ron">荣和</option><option value="tsumo">自摸</option></select></div><div><label>是否门清</label><select id="closed"><option value="1">门清</option><option value="0">已副露</option></select></div><div><label>特殊牌型</label><select id="special"><option value="normal">普通</option><option value="seven">七对子</option><option value="pinfu">平和</option></select></div></div></section><section><h2>② 役种（常用）</h2><div class="checks" id="yaku"></div><p class="small">请自行确认役种成立；同一组役可能互斥，复杂牌型需人工核对。</p><div class="grid"><div><label>普通宝牌数（含赤宝）</label><input id="dora" type="number" min="0" max="30" value="0"></div><div><label>里宝牌数（仅立直和牌）</label><input id="ura" type="number" min="0" max="30" value="0"></div></div></section><section><h2>③ 符数</h2><div class="grid"><div><label>雀头</label><select id="head"><option value="0">普通 0符</option><option value="2">役牌 2符</option><option value="4">连风牌 4符</option></select></div><div><label>听牌形状</label><select id="wait"><option value="0">两面 0符</option><option value="2">边张/嵌张/单骑 2符</option></select></div></div><div class="grid" id="melds"></div><p class="small">刻子按明暗及幺九分类；荣和完成的刻子按明刻。七对子固定25符；平和自摸20符。</p></section><section><h2>④ 本场和供托</h2><div class="grid"><div><label>本场数</label><input id="honba" type="number" min="0" value="0"></div><div><label>立直供托（1000点/根）</label><input id="sticks" type="number" min="0" value="0"></div></div></section><section class="result"><div>计算结果</div><div id="score" class="big">—</div><div id="details"></div><hr><div id="payments"></div></section><section><h2>注意事项</h2><p class="small">必须至少有一个役，宝牌不能单独作为役。3番70符及以上、4番40符及以上按满贯；5番满贯、6–7番跳满、8–10番倍满、11–12番三倍满、13番及以上按累计役满。本计算器不支持役满复合、责任支付、特殊地方规则及完整役种冲突验证。</p><button id="reset">重置</button></section></main><script>
const ys=[["立直",1,1],["一发",1,1],["门清自摸",1,1],["断幺九",1,0],["役牌（每组）",1,0],["一杯口",1,1],["三色同顺",2,0,1],["一气通贯",2,0,1],["混全带幺九",2,0,1],["对对和",2,0],["三暗刻",2,0],["三色同刻",2,0],["小三元",2,0],["混老头",2,0],["混一色",3,0,1],["纯全带幺九",3,0,1],["二杯口",3,1],["清一色",6,0,1]];
const ms=[["明刻·中张",2],["明刻·幺九",4],["暗刻·中张",4],["暗刻·幺九",8],["明杠·中张",8],["明杠·幺九",16],["暗杠·中张",16],["暗杠·幺九",32]];
document.querySelector("#yaku").innerHTML=ys.map((y,i)=>'<label><input type="checkbox" class="y" data-i="'+i+'">'+y[0]+'（'+y[1]+'番'+(y[3]?'，副露减1':'')+'）</label>').join("");
document.querySelector("#melds").innerHTML=ms.map((m,i)=>'<div><label>'+m[0]+'（'+m[1]+'符/组）</label><select class="m" data-i="'+i+'">'+[0,1,2,3,4].map(n=>'<option value="'+n+'">'+n+'组</option>').join('')+'</select></div>').join("");
const v=id=>document.getElementById(id).value,n=id=>Math.max(0,Number(v(id))||0),round=x=>Math.ceil(x/100)*100;
function calc(){let closed=v("closed")==="1",tsumo=v("win")==="tsumo",dealer=v("dealer")==="1",special=v("special");let selected=[...document.querySelectorAll(".y:checked")].map(x=>ys[Number(x.dataset.i)]);let han=selected.reduce((s,y)=>s+(y[2]&&!closed?0:y[1]-(y[3]&&!closed?1:0)),0)+(special==="seven"?2:special==="pinfu"&&closed?1:0)+n("dora");let riichi=selected.some(y=>y[0]==="立直");if(riichi&&closed)han+=n("ura");let raw=20+(closed&&!tsumo?10:0)+(tsumo?2:0)+n("head")+n("wait");let meldCount=0;document.querySelectorAll(".m").forEach(x=>{let c=Number(x.value);meldCount+=c;raw+=c*ms[Number(x.dataset.i)][1]});let fu=special==="seven"?25:special==="pinfu"&&closed&&tsumo?20:Math.ceil(Math.max(raw,!closed&&!tsumo?30:0)/10)*10;let warnings=[];if(!closed&&selected.some(y=>y[2]))warnings.push("已副露：门清限定役不计番");if(special==="seven"&&meldCount)warnings.push("七对子不能包含刻杠");if(special==="pinfu"&&!closed)warnings.push("平和必须门清");if(special==="pinfu"&&n("wait"))warnings.push("平和必须两面听牌");if(riichi&&!closed)warnings.push("副露后不能立直");if(meldCount>4)warnings.push("面子数超过4");if(han<1)warnings.push("没有足够的役，不能和牌（宝牌不是役）");let base=han>=13?8000:han>=11?6000:han>=8?4000:han>=6?3000:han>=5||(han===4&&fu>=40)||(han===3&&fu>=70)?2000:Math.min(2000,fu*2**(han+2));let h=n("honba"),sticks=n("sticks"),pay="",total=0;if(tsumo){let each=round(base*2)+h*100;if(dealer){total=each*3;pay="其余三家各付 "+each.toLocaleString()+" 点"}else{let small=round(base)+h*100;total=each+2*small;pay="庄家付 "+each.toLocaleString()+" 点；另两家各付 "+small.toLocaleString()+" 点"}}else{total=round(base*(dealer?6:4))+h*300;pay="放铳者支付 "+total.toLocaleString()+" 点"}document.querySelector("#score").textContent=han+"番 "+fu+"符";document.querySelector("#details").textContent=han>=13?"累计役满":han>=11?"三倍满":han>=8?"倍满":han>=6?"跳满":base===2000?"满贯":"普通计分";document.querySelector("#payments").innerHTML='<p>'+pay+'</p><p><b>和牌者收入 '+(total+sticks*1000).toLocaleString()+' 点</b>（含供托 '+(sticks*1000).toLocaleString()+' 点）</p>'+(warnings.length?'<p class="warning">'+warnings.join("；")+'</p>':'');}
document.querySelectorAll("input,select").forEach(x=>x.addEventListener("change",calc));document.querySelector("#reset").onclick=()=>location.reload();calc();
</script></body></html>
